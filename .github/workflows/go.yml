name: Go CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi

  native-tests:
    name: native-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build all packages
        run: go build -buildvcs=false ./...
      - name: Smoke-test CLI scan
        run: go run ./cmd/gg-lint scan --fail-on=none --format=json ./cmd/gg-lint

  race-tests:
    name: race-tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run race-enabled tests
        run: go test -race -cover ./...
