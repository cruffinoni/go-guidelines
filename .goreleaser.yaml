version: 2
project_name: gg-lint

builds:
  - id: gg-lint
    main: ./cmd/gg-lint
    binary: gg-lint
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.builtAt={{.Date}}

archives:
  - id: archives
    ids:
      - gg-lint
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: cruffinoni
    name: go-guidelines
